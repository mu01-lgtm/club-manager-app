name: Build Full Live Android Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. KODU ÇEK
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. API 35 KUR
      # ============================================================
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      # ============================================================
      # 5. NATIVE ANDROID PROJESİNİ OLUŞTUR
      # ============================================================
      - name: Create Native Android App
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/football/clubmanager2027/game

          mkdir -p app/src/main/res/values

          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi


          # ========================================================
          # SABİT KEYSTORE
          # ========================================================

          cat << 'EOF' | base64 -d > app/upload_keystore.jks
          
          EOF


          # ========================================================
          # İKON
          # ========================================================

          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi


          # ========================================================
          # ANDROID MANIFEST
          # ========================================================

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Club Manager 2027 - Football"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          cat << 'EOF' > app/src/main/java/com/football/clubmanager2027/game/MainActivity.java
          package com.football.clubmanager2027.game;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView mWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  mWebView = new WebView(this);

                  mWebView.setBackgroundColor(Color.BLACK);

                  WebSettings webSettings = mWebView.getSettings();

                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);

                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);

                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);

                  webSettings.setLoadsImagesAutomatically(true);
                  webSettings.setBlockNetworkImage(false);

                  webSettings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  );

                  CookieManager cookieManager =
                      CookieManager.getInstance();

                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(
                      mWebView,
                      true
                  );

                  webSettings.setCacheMode(
                      WebSettings.LOAD_DEFAULT
                  );

                  mWebView.setScrollBarStyle(
                      View.SCROLLBARS_INSIDE_OVERLAY
                  );

                  mWebView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public void onPageFinished(
                              WebView view,
                              String url
                          ) {

                              new Handler(
                                  Looper.getMainLooper()
                              ).postDelayed(
                                  new Runnable() {

                                      @Override
                                      public void run() {

                                          mWebView.evaluateJavascript(
                                              "window.dispatchEvent(new Event('app-ready'));",
                                              null
                                          );
                                      }

                                  },
                                  4000
                              );
                          }
                      }
                  );

                  mWebView.loadUrl(
                      "https://football-manager-menajerlik-oyunu.ai.studio"
                  );

                  setContentView(mWebView);
              }


              @Override
              public void onBackPressed() {

                  if (mWebView.canGoBack()) {
                      mWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF


          # ========================================================
          # ROOT GRADLE
          # ========================================================

          cat << 'EOF' > build.gradle

          buildscript {

              repositories {
                  google()
                  mavenCentral()
          }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }

          allprojects {

              repositories {
                  google()
                  mavenCentral()
              }
          }

          EOF


          # ========================================================
          # SETTINGS GRADLE
          # ========================================================

          cat << 'EOF' > settings.gradle

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ClubManager2027"

          include ':app'

          EOF


          # ========================================================
          # APP GRADLE
          # API 35 + JAVA 17 + RELEASE SIGNING
          # ========================================================

          cat << 'EOF' > app/build.gradle

          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.football.clubmanager2027.game'

              compileSdk 35

              defaultConfig {

                  applicationId "com.football.clubmanager2027.game"

                  minSdk 21

                  targetSdk 35

                  versionCode 1

                  versionName "1.0.0"
              }


              signingConfigs {

                  release {

                      storeFile file('upload_keystore.jks')

                      storePassword 'ClubManagerPass123'

                      keyAlias 'upload'

                      keyPassword 'ClubManagerPass123'
                  }
              }


              buildTypes {

                  release {

                      minifyEnabled false

                      shrinkResources false

                      signingConfig signingConfigs.release
                  }

                  debug {

                      signingConfig signingConfigs.release
                  }
              }


              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          EOF


      # ============================================================
      # 6. KEYSTORE KONTROLÜ
      # ============================================================
      - name: Verify Keystore
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "KEYSTORE KONTROLÜ"
          echo "======================================"

          if [ ! -f "app/upload_keystore.jks" ]; then

            echo "ERROR: app/upload_keystore.jks bulunamadı!"

            echo ""
            echo "Mevcut klasör:"
            pwd

            echo ""
            echo "Root dosyaları:"
            ls -la

            echo ""
            echo "App klasörü:"
            ls -la app || true

            exit 1
          fi


          echo "Keystore bulundu."

          ls -lh app/upload_keystore.jks


          echo ""
          echo "Keystore doğrulanıyor..."


          keytool -list \
            -keystore app/upload_keystore.jks \
            -storepass 'ClubManagerPass123' \
            -alias upload


          echo ""
          echo "Keystore doğrulama BAŞARILI."


      # ============================================================
      # 7. GRADLE KUR
      # ============================================================
      - name: Setup Gradle
        run: |

          gradle wrapper --gradle-version 8.5

          chmod +x ./gradlew


      # ============================================================
      # 8. TEMİZLE
      # ============================================================
      - name: Clean Project
        run: |

          ./gradlew clean


      # ============================================================
      # 9. AAB + APK OLUŞTUR
      # ============================================================
      - name: Build Release AAB and APK
        run: |

          ./gradlew \
            bundleRelease \
            assembleRelease \
            --stacktrace


      # ============================================================
      # 10. API 35 KONTROL
      # ============================================================
      - name: Verify Android API and Version
        run: |

          echo "======================================"
          echo "ANDROID BUILD KONTROLÜ"
          echo "======================================"

          echo "Compile SDK:"
          grep "compileSdk" app/build.gradle

          echo "Target SDK:"
          grep "targetSdk" app/build.gradle

          echo "Version:"
          grep "versionName" app/build.gradle

          echo ""
          echo "Oluşturulan dosyalar:"

          find app/build/outputs/ \
            -type f \
            \( -name "*.aab" -o -name "*.apk" \) \
            -print


      # ============================================================
      # 11. RELEASE DOSYALARINI HAZIRLA
      # ============================================================
      - name: Prepare Release Files
        shell: bash
        run: |

          set -e

          rm -rf final_output

          mkdir -p final_output


          # Play Store AAB
          AAB_FILE=$(find app/build/outputs/ \
            -type f \
            -name "*.aab" \
            | head -n 1)


          if [ -z "$AAB_FILE" ]; then

            echo "ERROR: AAB bulunamadı!"

            exit 1
          fi


          cp "$AAB_FILE" \
            final_output/ClubManager2027-PlayStore.aab


          # Direct APK
          APK_FILE=$(find app/build/outputs/ \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK bulunamadı!"

            exit 1
          fi


          cp "$APK_FILE" \
            final_output/ClubManager2027-DirectInstall.apk


          echo ""
          echo "======================================"
          echo "RELEASE DOSYALARI"
          echo "======================================"

          ls -lh final_output/


      # ============================================================
      # 12. ARTIFACT YÜKLE
      # ============================================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:

          name: ClubManager2027-Release-Files

          path: final_output/*

          if-no-files-found: error

          retention-days: 30
