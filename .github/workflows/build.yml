name: Build Full Offline Android Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract and Build React Game
        run: |
          mkdir -p game_source
          unzip -o game.zip -d game_source/
          cd game_source
          
          # Paketleri yükle ve göreceli yollarla derle
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm install --force
          npx vite build --base=./
          
          # Derlenen dosyaları ve public altındaki logoları hazırla
          mkdir -p ../app_assets
          cp -r dist/* ../app_assets/
          
          # Logoları garantiye almak için doğrudan kök ve logos klasörüne eşitle
          if [ -d "public/logos" ]; then
            mkdir -p ../app_assets/logos
            cp -r public/logos/* ../app_assets/logos/
          fi
          if [ -d "public" ]; then
            cp -r public/* ../app_assets/ 2>/dev/null || true
          fi

      - name: Create Offline Native Android App
        run: |
          mkdir -p app/src/main/java/com/clubmanager/game
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/assets

          # 1. Derlenmiş oyun ve logoları assets içine taşı
          cp -r app_assets/* app/src/main/assets/

          # 2. İkonu klasörlere kopyala
          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

          # 3. Android Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Club Manager 27"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 4. MainActivity
          cat << 'EOF' > app/src/main/java/com/clubmanager/game/MainActivity.java
          package com.clubmanager.game;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView mWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  mWebView = new WebView(this);
                  mWebView.setBackgroundColor(Color.BLACK);
                  
                  WebSettings webSettings = mWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowFileAccessFromFileURLs(true);
                  webSettings.setAllowUniversalAccessFromFileURLs(true);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);

                  mWebView.setWebViewClient(new WebViewClient());
                  mWebView.loadUrl("file:///android_asset/index.html");
                  setContentView(mWebView);
              }

              @Override
              public void onBackPressed() {
                  if (mWebView.canGoBack()) {
                      mWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # 5. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          # 6. App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.clubmanager.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.clubmanager.game"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Build Signed APK and AAB
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug
          ./gradlew bundleRelease
          mkdir -p final_output
          find app/build/outputs/ -name "*.apk" -exec cp {} final_output/ClubManager27.apk \;
          find app/build/outputs/ -name "*.aab" -exec cp {} final_output/ClubManager27.aab \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClubManager27-WithLogos
          path: final_output/*
