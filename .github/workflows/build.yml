name: Build Full Live Android Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # NATIVE ANDROID PROJECT
      # ============================================================
      - name: Create Native Android App
        run: |
          mkdir -p app/src/main/java/com/football/clubmanager2027/game
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          # --------------------------------------------------------
          # AndroidManifest.xml
          # --------------------------------------------------------
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Club Manager 2027 - Football"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          # --------------------------------------------------------
          # MainActivity.java
          # --------------------------------------------------------
          cat << 'EOF' > app/src/main/java/com/football/clubmanager2027/game/MainActivity.java
          package com.football.clubmanager2027.game;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView mWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  mWebView = new WebView(this);
                  mWebView.setBackgroundColor(Color.BLACK);

                  WebSettings webSettings = mWebView.getSettings();

                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);

                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);

                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);

                  webSettings.setLoadsImagesAutomatically(true);
                  webSettings.setBlockNetworkImage(false);

                  webSettings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  );

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(
                      mWebView,
                      true
                  );

                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  mWebView.setScrollBarStyle(
                      View.SCROLLBARS_INSIDE_OVERLAY
                  );

                  mWebView.setWebViewClient(new WebViewClient() {

                      @Override
                      public void onPageFinished(
                          WebView view,
                          String url
                      ) {
                          new Handler(
                              Looper.getMainLooper()
                          ).postDelayed(
                              new Runnable() {
                                  @Override
                                  public void run() {
                                      mWebView.evaluateJavascript(
                                          "window.dispatchEvent(new Event('app-ready'));",
                                          null
                                      );
                                  }
                              },
                              4000
                          );
                      }
                  });

                  mWebView.loadUrl(
                      "https://football-manager-menajerlik-oyunu.ai.studio"
                  );

                  setContentView(mWebView);
              }

              @Override
              public void onBackPressed() {
                  if (mWebView.canGoBack()) {
                      mWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # Root Gradle
          # --------------------------------------------------------
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # --------------------------------------------------------
          # Settings
          # --------------------------------------------------------
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ClubManager2027"
          include ':app'
          EOF

          # --------------------------------------------------------
          # App Gradle
          # --------------------------------------------------------
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.football.clubmanager2027.game'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.football.clubmanager2027.game'

                  minSdk 21
                  targetSdk 35

                  versionCode 1
                  versionName '1.0.0'
              }

              signingConfigs {
                  release {
                      storeFile file('upload_keystore.jks')

                      storePassword System.getenv(
                          'UPLOAD_KEYSTORE_PASSWORD'
                      )

                      keyAlias System.getenv(
                          'UPLOAD_KEY_ALIAS'
                      )

                      keyPassword System.getenv(
                          'UPLOAD_KEY_PASSWORD'
                      )
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }

                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      # ============================================================
      # ICON
      # ============================================================
      - name: Copy App Icon
        run: |
          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

      # ============================================================
      # RESTORE GOOGLE PLAY UPLOAD KEY
      # ============================================================
      - name: Restore Upload Keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > app/upload_keystore.jks

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Google Play Release AAB
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          gradle wrapper --gradle-version 8.5

          chmod +x ./gradlew

          ./gradlew clean bundleRelease assembleRelease

          mkdir -p final_output

          find app/build/outputs/ -name "*.apk" \
            -exec cp {} final_output/ClubManager2027-DirectInstall.apk \;

          find app/build/outputs/ -name "*.aab" \
            -exec cp {} final_output/ClubManager2027-PlayStore.aab \;

      # ============================================================
      # VERIFY PACKAGE NAME
      # ============================================================
      - name: Verify Application ID
        run: |
          echo "Expected package:"
          echo "com.football.clubmanager2027.game"

          echo ""
          echo "AAB:"
          ls -lh final_output/ClubManager2027-PlayStore.aab

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClubManager2027-Release-Files
          path: final_output/*
