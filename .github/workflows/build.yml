name: Build Full Live Android Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Native Android App
        run: |
          mkdir -p app/src/main/java/com/football/clubmanager
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          # Guvenli Keystore Uretimi (Google Play sifirlama istegiyle tam uyumlu)
          keytool -genkeypair -v \
            -keystore app/upload_keystore.jks \
            -alias uploadkey2027 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ClubManager2027Secure \
            -keypass ClubManager2027Secure \
            -dname "CN=ClubManager, OU=Games, O=ClubManager, L=Istanbul, ST=Istanbul, C=TR"

          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Club Manager 2027 - Football"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/football/clubmanager/MainActivity.java
          package com.football.clubmanager;

          import android.app.Activity;
          import android.graphics.Color;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView mWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemUI();

                  mWebView = new WebView(this);
                  mWebView.setBackgroundColor(Color.BLACK);
                  mWebView.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                  WebSettings webSettings = mWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setLoadsImagesAutomatically(true);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  // Hizli acilis optimizasyonu (Onbellekten aninda yukler, gereksiz 3 sn gecikmeyi kaldirir)
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  String customUA = webSettings.getUserAgentString() + " Chrome/120.0.0.0 Mobile Safari/537.36";
                  webSettings.setUserAgentString(customUA);

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(mWebView, true);

                  mWebView.setScrollBarStyle(View.SCROLLBARS_INSIDE_OVERLAY);
                  mWebView.setWebChromeClient(new WebChromeClient());
                  mWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed();
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          view.loadUrl(url);
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          hideSystemUI();
                          mWebView.evaluateJavascript("window.dispatchEvent(new Event('app-ready'));", null);
                      }
                  });

                  mWebView.loadUrl("https://football-manager-menajerlik-oyunu.ai.studio");
                  setContentView(mWebView);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN);
              }

              @Override
              public void onBackPressed() {
                  if (mWebView.canGoBack()) {
                      mWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.football.clubmanager'
              compileSdk 36

              defaultConfig {
                  applicationId "com.football.clubmanager"
                  minSdk 21
                  targetSdk 36
                  versionCode 10
                  versionName "1.0.9"
              }

              signingConfigs {
                  release {
                      storeFile file('upload_keystore.jks')
                      storePassword 'ClubManager2027Secure'
                      keyAlias 'uploadkey2027'
                      keyPassword 'ClubManager2027Secure'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Build Signed AAB and APK
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew bundleRelease assembleRelease
          mkdir -p final_output
          find app/build/outputs/ -name "*.apk" -exec cp {} final_output/ClubManager2027-DirectInstall.apk \;
          find app/build/outputs/ -name "*.aab" -exec cp {} final_output/ClubManager2027-PlayStore.aab \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClubManager2027-Release-Files
          path: final_output/*
