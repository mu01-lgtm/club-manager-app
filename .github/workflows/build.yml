name: Build Full Live Android Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. KODU AL
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. ANDROID API 35 KUR
      # ============================================================
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ============================================================
      # 5. ANDROID PROJESİNİ OLUŞTUR
      # ============================================================
      - name: Create Native Android App
        run: |

          mkdir -p app/src/main/java/com/football/clubmanager2027/game

          mkdir -p app/src/main/res/values

          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi


          # ========================================================
          # KEYSORE
          # ========================================================
          #
          # BURADA MEVCUT build.yml DOSYANDAKİ
          # "1. Sabit Keystore Dosyası" BÖLÜMÜNÜ
          # AYNEN KORU.
          #
          # Yani mevcut dosyandaki:
          #
          # cat << 'EOF' | base64 -d > app/upload_keystore.jks
          # ...
          # EOF
          #
          # kısmını silme ve değiştirme.


          # ========================================================
          # ICON
          # ========================================================

          if [ -f "icon.png" ]; then

            cp icon.png \
              app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp icon.png \
              app/src/main/res/mipmap-xxhdpi/ic_launcher.png

            cp icon.png \
              app/src/main/res/mipmap-xhdpi/ic_launcher.png

            cp icon.png \
              app/src/main/res/mipmap-hdpi/ic_launcher.png

            cp icon.png \
              app/src/main/res/mipmap-mdpi/ic_launcher.png

          fi


          # ========================================================
          # ANDROID MANIFEST
          # ========================================================

          cat << 'EOF' > app/src/main/AndroidManifest.xml

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Club Manager 2027 - Football"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF


          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          cat << 'EOF' > app/src/main/java/com/football/clubmanager2027/game/MainActivity.java

          package com.football.clubmanager2027.game;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView mWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  mWebView = new WebView(this);

                  mWebView.setBackgroundColor(Color.BLACK);

                  WebSettings webSettings =
                      mWebView.getSettings();

                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);

                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);

                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);

                  webSettings.setLoadsImagesAutomatically(true);
                  webSettings.setBlockNetworkImage(false);

                  webSettings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  );

                  CookieManager cookieManager =
                      CookieManager.getInstance();

                  cookieManager.setAcceptCookie(true);

                  cookieManager.setAcceptThirdPartyCookies(
                      mWebView,
                      true
                  );

                  webSettings.setCacheMode(
                      WebSettings.LOAD_DEFAULT
                  );

                  mWebView.setScrollBarStyle(
                      View.SCROLLBARS_INSIDE_OVERLAY
                  );

                  mWebView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public void onPageFinished(
                              WebView view,
                              String url
                          ) {

                              new Handler(
                                  Looper.getMainLooper()
                              ).postDelayed(
                                  new Runnable() {

                                      @Override
                                      public void run() {

                                          mWebView.evaluateJavascript(
                                              "window.dispatchEvent(new Event('app-ready'));",
                                              null
                                          );

                                      }

                                  },
                                  4000
                              );

                          }

                      }
                  );

                  mWebView.loadUrl(
                      "https://football-manager-menajerlik-oyunu.ai.studio"
                  );

                  setContentView(mWebView);
              }


              @Override
              public void onBackPressed() {

                  if (mWebView.canGoBack()) {

                      mWebView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }

          }

          EOF


          # ========================================================
          # ROOT GRADLE
          # ========================================================

          cat << 'EOF' > build.gradle

          buildscript {

              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }

          }

          allprojects {

              repositories {
                  google()
                  mavenCentral()
              }

          }

          EOF


          # ========================================================
          # SETTINGS
          # ========================================================

          cat << 'EOF' > settings.gradle

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ClubManager2027"

          include ':app'

          EOF


          # ========================================================
          # APP GRADLE
          # ========================================================

          cat << 'EOF' > app/build.gradle

          plugins {
              id 'com.android.application'
          }


          android {

              namespace 'com.football.clubmanager2027.game'


              // ====================================================
              // GOOGLE PLAY API 35
              // ====================================================

              compileSdk 35


              defaultConfig {

                  applicationId "com.football.clubmanager2027.game"

                  minSdk 21

                  targetSdk 35


                  // =================================================
                  // YENİ PLAY STORE SÜRÜMÜ
                  // =================================================

                  versionCode 2

                  versionName "1.0.1"

              }


              // ====================================================
              // SIGNING
              // ====================================================

              signingConfigs {

                  release {

                      storeFile file(
                          'upload_keystore.jks'
                      )

                      /*
                       * MEVCUT DOSYANDAKİ
                       * signing bilgilerini AYNEN KORU.
                       *
                       * storePassword
                       * keyAlias
                       * keyPassword
                       */

                  }

              }


              // ====================================================
              // BUILD TYPES
              // ====================================================

              buildTypes {

                  release {

                      minifyEnabled false

                      shrinkResources false

                      signingConfig signingConfigs.release

                  }


                  debug {

                      signingConfig signingConfigs.release

                  }

              }


              // ====================================================
              // JAVA 17
              // ====================================================

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17

              }

          }

          EOF


      # ============================================================
      # 6. KEYSTORE KONTROLÜ
      # ============================================================
      - name: Verify Keystore
        run: |

          if [ ! -f "app/upload_keystore.jks" ]; then

            echo "ERROR: upload_keystore.jks bulunamadı!"

            exit 1

          fi

          echo "Keystore bulundu."


      # ============================================================
      # 7. GRADLE 8.5
      # ============================================================
      - name: Setup Gradle
        run: |

          gradle wrapper --gradle-version 8.5

          chmod +x ./gradlew


      # ============================================================
      # 8. TEMİZ BUILD
      # ============================================================
      - name: Clean Project
        run: |

          ./gradlew clean


      # ============================================================
      # 9. AAB + APK BUILD
      # ============================================================
      - name: Build Release AAB and APK
        run: |

          ./gradlew \
            bundleRelease \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 10. OUTPUT
      # ============================================================
      - name: Prepare Release Files
        run: |

          mkdir -p final_output


          find app/build/outputs/ \
            -type f \
            -name "*.aab" \
            -exec cp {} \
            final_output/ClubManager2027-PlayStore.aab \;


          find app/build/outputs/ \
            -type f \
            -name "*.apk" \
            -exec cp {} \
            final_output/ClubManager2027-DirectInstall.apk \;


          echo "====================================="
          echo "BUILD TAMAMLANDI"
          echo "====================================="

          ls -lh final_output/


      # ============================================================
      # 11. API 35 KONTROLÜ
      # ============================================================
      - name: Verify Android API and Version
        run: |

          echo "====================================="
          echo "GOOGLE PLAY BUILD KONTROLÜ"
          echo "====================================="

          echo "Compile SDK: 35"
          echo "Target SDK: 35"
          echo "Version Code: 2"
          echo "Version Name: 1.0.1"

          echo ""
          echo "AAB DOSYASI:"

          ls -lh \
            final_output/ClubManager2027-PlayStore.aab

          echo ""
          echo "APK DOSYASI:"

          ls -lh \
            final_output/ClubManager2027-DirectInstall.apk

          echo "====================================="


      # ============================================================
      # 12. ARTIFACT
      # ============================================================
      - name: Upload Release Files
        uses: actions/upload-artifact@v4

        with:

          name: ClubManager2027-Release-Files

          path: final_output/*

          if-no-files-found: error
