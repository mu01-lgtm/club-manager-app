plugins {
    id 'com.android.application'
}

android {
    namespace 'com.football.clubmanager2027.game'

    compileSdk 35

    defaultConfig {
        applicationId "com.football.clubmanager2027.game"

        minSdk 21

        targetSdk 35

        versionCode 1

        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file('upload_keystore.jks')

            storePassword 'ClubManagerPass123'

            keyAlias 'upload'

            keyPassword 'ClubManagerPass123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false

            shrinkResources false

            signingConfig signingConfigs.release
        }

        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17

        targetCompatibility JavaVersion.VERSION_17
    }
}
