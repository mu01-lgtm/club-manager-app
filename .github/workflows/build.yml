name: Build Android APK and AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web App with Capacitor
        run: |
          mkdir webapp && cd webapp
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # HTML dosyasını oyun linkine yönlendirecek şekilde hazırla
          mkdir www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <style>
              body, html, iframe { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
              iframe { border: none; }
            </style>
          </head>
          <body>
            <iframe src="https://football-manager-menajerlik-oyunu.ai.studio"></iframe>
          </body>
          </html>
          EOF

          # Capacitor Projesini başlat ve Android platformunu ekle
          npx cap init "Club Manager 27" "com.clubmanager.app" --web-dir="www"
          npx cap add android
          npx cap sync android

          # Android APK ve AAB derle
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClubManager27-Android-Build
          path: |
            webapp/android/app/build/outputs/apk/release/*.apk
            webapp/android/app/build/outputs/bundle/release/*.aab
